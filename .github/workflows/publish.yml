name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    if: github.repository == 'Wang060919/pi-web'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use npm 12
        run: npm install --global npm@12.0.1 --ignore-scripts --no-audit --no-fund

      - name: Check package and release target
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (pkg.name !== '@wang060919/pi-web'
            || pkg.repository?.url !== 'git+https://github.com/Wang060919/pi-web.git') {
            throw new Error('Package identity must match the independent repository.');
          }
          if (process.env.GITHUB_REF_TYPE === 'tag'
            && process.env.GITHUB_REF_NAME !== `v${pkg.version}`) {
            throw new Error('Release tag must match package.json version.');
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Check delivery artifacts
        run: npm run check:artifacts

      - name: Smoke test npm 12 global package install
        run: npm run smoke:package-install

      - name: Publish
        # Verify/build already ran above; publish the exact artifacts checked here.
        run: npm publish --access public --ignore-scripts
        env:
          # OIDC is used after configuring the package's trusted publisher.
          # A granular token in the npm environment can bootstrap the first release.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance is only supported for public source repositories.
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
