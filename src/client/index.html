<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>PI WEB</title>
    <meta name="theme-color" content="#1c1c1c" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" crossorigin="use-credentials" href="%BASE_URL%manifest.webmanifest" />
    <link rel="stylesheet" href="%BASE_URL%fonts/fonts.css" />
    <style>
      :root {
        color-scheme: dark;
        --pi-control-font-size: 14px;
        --pi-font-family: "Anthropic Sans Variable", "Anthropic Sans Variable Text", "Anthropic Sans", "anthropic-sans", "Figtree", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Adwaita Sans", Roboto, Helvetica, Arial, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
        --pi-font-monospace: "Anthropic Mono Web", "Anthropic Mono", "anthropic-mono", "SF Mono", "JetBrains Mono", "Noto Sans Mono", "Noto Sans Mono CJK SC", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --pi-font-serif: "Anthropic Serif Variable", "Anthropic Serif Variable Text", "Anthropic Serif", "anthropic-serif", "Source Serif 4", "Noto Serif SC", "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", Georgia, "Times New Roman", serif;
        --pi-font-weight-regular: 360;
        --pi-font-weight-medium: 460;
        --pi-font-weight-semibold: 540;
        --pi-font-weight-bold: 560;
        --pi-control-font-family: var(--pi-font-family);
        --pi-control-monospace-font-family: var(--pi-font-monospace);
        --pi-bg: #1c1c1c;
        --pi-surface: #282828;
        --pi-surface-hover: #333333;
        --pi-terminal-bg: #151515;
        --pi-terminal-text: #efeeeb;
        --pi-border: #ffffff2e;
        --pi-border-muted: #ffffff17;
        --pi-text: #efeeeb;
        --pi-text-secondary: #b5b3ad;
        --pi-text-bright: #f5f4f0;
        --pi-muted: #9c9a92;
        --pi-dim: #888680;
        --pi-accent: #d97757;
        --pi-accent-border: #d9775780;
        --pi-selection-bg: #3a3a3a;
        --pi-success: #98bd9d;
        --pi-success-border: #5d795e;
        --pi-success-bg: #252d25;
        --pi-success-surface: #303e31;
        --pi-success-ring: #98bd9d33;
        --pi-warning: #dfbd7b;
        --pi-warning-border: #8c7546;
        --pi-warning-surface: #342f23;
        --pi-danger: #efaaa2;
        --pi-purple: #c0b3ca;
        --pi-purple-border: #807289;
        --pi-purple-surface: #302b35;
        --pi-overlay: #00000099;
        --pi-shadow-soft: #00000066;
        --pi-shadow: #00000088;
        --pi-shadow-strong: #000000bb;
        --pi-bg-overlay-soft: #1c1c1cdd;
        --pi-bg-overlay: #1c1c1ce6;
        --pi-success-bg-overlay: #252d25ee;
        --pi-terminal-selection: #ffffff26;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--pi-bg); color: var(--pi-text); }
      body { min-height: 100dvh; font-family: var(--pi-font-family); font-weight: var(--pi-font-weight-regular); font-optical-sizing: auto; -webkit-font-smoothing: antialiased; }
      @media (max-width: 760px), (pointer: coarse) {
        :root { --pi-control-font-size: 16px; }
      }
    </style>
  </head>
  <body>
    <pi-web-app></pi-web-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
