<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">PI WEB</title>
  <desc id="desc">Pi's pixel mark.</desc>
  <style>
    .mark { fill: #151515; }
    @media (prefers-color-scheme: dark) { .mark { fill: #efeeeb; } }
  </style>
  <g class="mark" transform="translate(4 4) scale(6)"><g id="pi-mark">
    <rect x="0" y="0" width="1" height="1"/>
    <rect x="1" y="0" width="1" height="1"/>
    <rect x="2" y="0" width="1" height="1"/>
    <rect x="0" y="1" width="1" height="1"/>
    <rect x="2" y="1" width="1" height="1"/>
    <rect x="0" y="2" width="1" height="1"/>
    <rect x="1" y="2" width="1" height="1"/>
    <rect x="3" y="2" width="1" height="1"/>
    <rect x="0" y="3" width="1" height="1"/>
    <rect x="3" y="3" width="1" height="1"/>
  </g></g>
</svg>
